name: AiDoc

endpoints:
  GenerateFeatures:
    input: GenerateFeaturesRequest
    output: string[]
    mode: json

  GenerateDocs:
    input: GenerateDocsRequest
    output: string
    mode: text

tools:
  GetSource:
    input: GetFileRequest
    output: GetFileResponse
    description: Считывает содержимое указанного исходного файла.

  GetDoc:
    input: GetFileRequest
    output: GetFileResponse
    description: Считывает содержимое указанного файла документации.

schemas:
  GenerateFeaturesRequest:
    - name: name
      type: string
      description: Название проекта

    - name: structure_sources
      type: string[]
      description: Структура исходного кода в виде списка путей до файлов от корня

    - name: structure_docs
      type: string[]
      description: Структура существующей документации в виде списка путей до файлов от корня, если она есть (если документации еще нет, список будет пустым)

    - name: changed_sources
      type: string[]
      description: Список исходных файлов, которые были изменены

    - name: changed_docs
      type: string[]
      description: Список файлов документации, которые были изменены

  GenerateDocsRequest:
    - name: name
      type: string
      description: Название проекта

    - name: structure_sources
      type: string[]
      description: Структура исходного кода в виде списка путей до файлов от корня

    - name: changed_sources
      type: string[]
      description: Список исходных файлов, которые были изменены

    - name: feature
      type: string
      description: Фича проекта, для которой нужно создать или обновить документацию

    - name: current_doc
      type: string
      description: Текст текущей документации, если она есть

  GetFileRequest:
    - name: path
      type: string
      description: Путь к файлу от корневой папки

  GetFileResponse:
    - name: content
      type: string
      description: Содержимое файла. None если файл не найден, либо если это не файл с исходным кодом.
